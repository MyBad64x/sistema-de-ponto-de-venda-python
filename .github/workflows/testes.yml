name: Testes

# Roda em todo pull request e a cada push na main (por exemplo, quando um PR é mergeado)
on:
  pull_request:
  push:
    branches: [main]

# o workflow só precisa ler o código
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      # se uma combinação falhar, as outras continuam rodando
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # a versão mínima suportada e a mais recente; entre aspas, senão o YAML lê 3.10 como 3.1
        python: ["3.10", "3.14"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar as dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: python -m pytest -v